name: Auto Decode and Push Builds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: auto-decode-and-push
  cancel-in-progress: true

jobs:
  decode-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NepaliStream CNC Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JADX
        run: |
          curl -L --fail --silent --show-error https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          echo "/tmp/jadx/bin" >> "$GITHUB_PATH"
      - name: Auto-pull both public builds branches
        run: python auto-pusher.py
      - name: Decode every root-level CS3 file
        run: python decoder.py
      - name: Commit and push changed decoded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No upstream changes detected."
          else
            git commit -m "Auto-update mixed decoded builds"
            git push
          fi
